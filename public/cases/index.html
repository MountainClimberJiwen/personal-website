<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案例集 — [你的名字]</title>
  <link rel="stylesheet" href="cases.css">
</head>
<body>
  <header class="page-header">
    <a class="back-link" href="../">← 返回主页</a>
    <h1>个人案例集</h1>
    <p class="page-sub">[一句话介绍这个案例集，比如：我做过的项目、实验和作品]</p>
  </header>

  <main class="case-grid">
    <!-- 案例卡片模板：复制一段改内容即可
         类型 A：图片案例（<img>）
         类型 B：视频案例（<video>）
    -->

    <!-- ============ 案例 1（图片） ============ -->
    <article class="case-card">
      <div class="case-media">
        <!-- 换成你的图片路径，如 media/case-1-cover.jpg -->
        <img src="media/placeholder.jpg" alt="[案例 1 标题]" loading="lazy">
      </div>
      <div class="case-body">
        <h2>[案例 1 标题]</h2>
        <p class="case-desc">[一两句话说明：这是什么、解决了什么问题、你的角色]</p>
        <div class="case-tags">
          <span>[标签]</span><span>[标签]</span>
        </div>
        <a class="case-link" href="#" target="_blank" rel="noopener">查看详情 →</a>
      </div>
    </article>

    <!-- ============ 案例 2（视频） ============ -->
    <article class="case-card">
      <div class="case-media">
        <video controls preload="metadata" playsinline poster="media/placeholder.jpg">
          <!-- 换成你的视频文件，如 media/case-2-demo.mp4 -->
          <source src="media/case-2-demo.mp4" type="video/mp4">
        </video>
      </div>
      <div class="case-body">
        <h2>[案例 2 标题]</h2>
        <p class="case-desc">[一两句话说明这个案例]</p>
        <div class="case-tags">
          <span>[标签]</span><span>[标签]</span>
        </div>
        <a class="case-link" href="#" target="_blank" rel="noopener">查看详情 →</a>
      </div>
    </article>

    <!-- ============ 案例 3（图片） ============ -->
    <article class="case-card">
      <div class="case-media">
        <img src="media/placeholder.jpg" alt="[案例 3 标题]" loading="lazy">
      </div>
      <div class="case-body">
        <h2>[案例 3 标题]</h2>
        <p class="case-desc">[一两句话说明这个案例]</p>
        <div class="case-tags">
          <span>[标签]</span><span>[标签]</span>
        </div>
        <a class="case-link" href="#" target="_blank" rel="noopener">查看详情 →</a>
      </div>
    </article>

    <!-- ============ 案例 4（视频） ============ -->
    <article class="case-card">
      <div class="case-media">
        <video controls preload="metadata" playsinline poster="media/placeholder.jpg">
          <source src="media/case-4-demo.mp4" type="video/mp4">
        </video>
      </div>
      <div class="case-body">
        <h2>[案例 4 标题]</h2>
        <p class="case-desc">[一两句话说明这个案例]</p>
        <div class="case-tags">
          <span>[标签]</span><span>[标签]</span>
        </div>
        <a class="case-link" href="#" target="_blank" rel="noopener">查看详情 →</a>
      </div>
    </article>

    <!-- 更多案例：复制上面的 <article> 块，改内容 -->
  </main>

  <footer class="page-footer">
    <a class="back-link" href="../">← 返回主页</a>
  </footer>
</body>
</html>
